<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
	<link rel="stylesheet" href="style.css">
</head>
<body bgcolor="pink">
	<h1> Ajout d'un nouveau véhicule</h1>
	<form action="#" method="post">
<table width="70%" border="0">

	<tr>
<td><label for="marque">Marque :</label></td>
<td>
<select id="marque" name="marque">
<option value="peugeot">Peugeot</option>
<option value="versailles">Mercedes</option>
<option value="creteil">Renault</option>
	</select>
</tr>
</td>
<tr>
<td><label for="immatriculation">Immatriculation:</label></td>
<td><input type="text" id="immatriculation" name="immatriculation"></td>
</tr>
<tr>
<td><label for="couleur">Couleur:</label></td>
<td><input type="text" id="couleur" name="couleur"></td>
</tr>
<tr>
<td><label for="dateimmatriculation">Date d'immatriculation:</label></td>
<td><input type="date" id="dateimmatriculation" name="dateimmatriculation"></td>
</tr>
<tr>
<td><label for="kilometrage">Kilométrage :</label></td>
<td><input type="number" id="kilometrage" name="kilometrage"></td>
</tr>
<tr>
  
<td><label>État :</label></td>
<td>
<input type="radio" id="neuf" name="etat_produit" value="neuf" checked>
<label for="neuf">Neuf</label>
    
<br> 
    
<input type="radio" id="occasion" name="etat_produit" value="occasion">
<label for="occasion">Occasion</label>
</td>
</tr>

<tr>
  
<td><label>Carburant :</label></td>
<td>
	<br><br><br>
<input type="radio" id="hybride" name="type_carburant" value="hybride"checked>
<label for="hybride">Hybride</label>
<br>

<input type="radio" id="electrique" name="type_carburant" value="electrique">
<label for="electrique">Électrique</label>

    <br>
<input type="radio" id="diesel" name="type_carburant" value="diesel">
<label for="diesel">Diesel</label>
    <br>

<input type="radio" id="essence" name="type_carburant" value="essence">
<label for="essence">Essence</label>
</td>
</tr>
<tr>
  
<td><label>Boîte de vitesse :</label></td>
  
<td><br><br><br>
<input type="radio" id="manuelle" name="boite_vitesse" value="manuelle" checked>
<label for="manuelle">Manuelle</label>
<br>
<input type="radio" id="automatique" name="boite_vitesse" value="automatique">
<label for="automatique">Automatique</label>
<br><br>
</td>
</tr>
<tr>

<td><label for="portes">Nombre de portes:</label></td>

<td><input type="number" id="portes" name="portes"></td>
</tr>

<tr>
<td><label>Toît :</label></td>
<td>
	<br><br><br>
<input type="radio" id="ouvrant" name="toit" value="ouvrant" checked>
<label for="ouvrant">Ouvrant</label>
<br>

<input type="radio" id="fermant" name="toit" value="fermant">
<label for="fermant">Fermant</label>
</td>
</tr>

<tr>
<td><label>Climatisation:</label></td>
<td>
	<br><br><br>
<input type="radio" id="oui" name="climatisation" value="oui" checked>
<label for="oui">Oui</label>
<br>
<input type="radio" id="non" name="climatisation" value="non">
<label for="non">Non</label>
<br><br>
</td>
</tr>
<tr>
<tr>
<td><label for="commentaires">Informations supplémentaires :</label></td>
<td><textarea id="commentaires" name="commentaires" rows="4" cols="30"></textarea></td>
</tr>
<tr>
<td></td>
<td>
<button type="submit">Enregistrer</button>
<button type="reset">Annuler</button>
</td>
</tr>
</table>
</form>
</body>
</html>
